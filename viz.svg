<text x="56.0" y="197.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">BFS level by level (shortest = BFS, never DFS): level 1 {hit}, 2 {hot}, 3 {dot,</text>
<text x="56.0" y="216.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">lot}, 4 {dog, log}, 5 {cog}. Neighbors are generated by trying all 26 letters at</text>
<text x="56.0" y="235.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">each position — O(26·len) per word beats comparing all word pairs.</text>
