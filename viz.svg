<text x="56.0" y="480.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Length 5 (counting both ends). If cog isn't in the dictionary, the wave never</text>
